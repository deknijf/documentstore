server {
    listen 80;
    listen [::]:80;
    server_name docstore.deknijf.eu;

    # Scans and multi-page PDFs regularly exceed nginx's 1m default, which would
    # reject the upload before the application ever sees it. Kept just above the
    # application's own MAX_UPLOAD_MB (50) so that cap is the effective one and
    # the client gets Docstore's JSON error instead of an nginx HTML page.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

